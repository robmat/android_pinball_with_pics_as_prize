android.nonFinalResIds=false
android.nonTransitiveRClass=false
android.useAndroidX=true
org.gradle.jvmargs=-Xmx4096m
android.builtInKotlin=false
android.newDsl=false
org.gradle.configuration-cache=true

# shrinkResources turns on AGP's optimized resource shrinker, which refuses to run
# alongside android.nonFinalResIds=false ("Optimized resource shrinking requires
# non-final IDs"). Matches the opt-out the rest of the fleet already carries.
android.r8.optimizedResourceShrinking=false
