import javax.inject.Inject

plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'com.batodev.releasetools'
    id 'io.gitlab.arturbosch.detekt'
}

def localProperties = new Properties()
localProperties.load(new FileInputStream(rootProject.file("local.properties")))

def keystorePropertiesFile = rootProject.file("../keystore.properties")
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

def versionProps = new Properties()
file("version.properties").withInputStream { versionProps.load(it) }

android {
    compileSdk = 37

    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility = JavaVersion.VERSION_21
        targetCompatibility = JavaVersion.VERSION_21
    }

    kotlinOptions {
        jvmTarget = "21"
    }

    defaultConfig {
        applicationId "com.batodev.pinball"
        minSdkVersion 23
        targetSdkVersion 37
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        versionCode versionProps.getProperty("versionCode").toInteger()
        versionName versionProps.getProperty("versionName")
        multiDexEnabled true
        buildConfigField(
                "String",
                "AD_HELPER_AD_ID",
                "\"" + localProperties.getProperty("adhelper.ad.id") + "\""
        )
        manifestPlaceholders.put("MANIFEST_AD_ID", localProperties.getProperty("manifest.ad.id"))
        externalNativeBuild {
            cmake {
                arguments "-DANDROID_SUPPORT_FLEXIBLE_PAGE_SIZES=ON"
            }
        }
    }


    signingConfigs {
        release {
            if (keystorePropertiesFile.exists()) {
                storeFile rootProject.file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.txt'
            signingConfig signingConfigs.release
        }
    }

    sourceSets {
        main {
            jniLibs.srcDirs = ['libs']
        }
    }
    buildFeatures {
        buildConfig true
    }
    namespace 'com.batodev.pinball'
}

ext {
    // Sourced from the shared catalog (libs.versions.gdx) rather than a bare literal,
    // since the natives coordinates below need it interpolated into a classifier
    // string that Gradle version catalogs can't express directly.
    gdxVersion = libs.versions.gdx.get()
}

configurations { natives }

// libgdx native libraries are copied to libs/ by the copyAndroidNatives task.
dependencies {
    detektPlugins libs.detekt.formatting

    implementation libs.androidx.core.ktx
    implementation libs.androidx.appcompat
    implementation libs.material
    implementation libs.androidx.constraintlayout
    implementation libs.chrisbanes.photoview
    implementation libs.gdx
    implementation libs.gdx.box2d
    implementation libs.play.services.ads
    implementation libs.google.play.review
    implementation libs.google.play.review.ktx
    natives "com.badlogicgames.gdx:gdx-platform:$gdxVersion:natives-arm64-v8a"
    natives "com.badlogicgames.gdx:gdx-platform:$gdxVersion:natives-armeabi-v7a"
    natives "com.badlogicgames.gdx:gdx-platform:$gdxVersion:natives-x86"
    natives "com.badlogicgames.gdx:gdx-platform:$gdxVersion:natives-x86_64"
    natives "com.badlogicgames.gdx:gdx-box2d-platform:$gdxVersion:natives-armeabi-v7a"
    natives "com.badlogicgames.gdx:gdx-box2d-platform:$gdxVersion:natives-arm64-v8a"
    natives "com.badlogicgames.gdx:gdx-box2d-platform:$gdxVersion:natives-x86"
    natives "com.badlogicgames.gdx:gdx-box2d-platform:$gdxVersion:natives-x86_64"

    coreLibraryDesugaring libs.android.tools.desugar.jdk.libs

    androidTestImplementation libs.androidx.test.ext.junit
    androidTestImplementation libs.androidx.test.espresso.core
    androidTestImplementation libs.androidx.test.espresso.intents
}

// Called every time gradle gets executed, takes the native dependencies of
// the natives configuration, and extracts them to the proper libs/ folders
// so they get packed with the APK.
//
// A real (typed) task class rather than an ad-hoc `doFirst { file(...); copy {} }`
// block: the configuration cache forbids referencing Project-scoped methods like
// file()/copy()/zipTree() from a task action at execution time, so the copy/unzip
// work goes through the injected FileSystemOperations/ArchiveOperations services
// instead - see https://docs.gradle.org/current/userguide/configuration_cache_requirements.html
abstract class CopyAndroidNatives extends DefaultTask {
    @InputFiles
    abstract ConfigurableFileCollection getNativesJars()

    @OutputDirectory
    abstract DirectoryProperty getLibsDir()

    @Inject
    abstract FileSystemOperations getFs()

    @Inject
    abstract ArchiveOperations getArchive()

    @TaskAction
    void copyNatives() {
        def abiDirs = ["armeabi-v7a", "arm64-v8a", "x86_64", "x86"].collectEntries { abi ->
            def dir = libsDir.dir(abi).get().asFile
            dir.mkdirs()
            [(abi): dir]
        }

        nativesJars.files.each { jar ->
            def targetDir = abiDirs.find { abi, dir -> jar.name.endsWith("natives-${abi}.jar") }?.value
            if (targetDir != null) {
                fs.copy {
                    from archive.zipTree(jar)
                    into targetDir
                    include "*.so"
                }
            }
        }
    }
}

tasks.register('copyAndroidNatives', CopyAndroidNatives) {
    nativesJars.from(configurations.natives)
    libsDir.set(layout.projectDirectory.dir("libs"))
}

tasks.matching { it.name.contains("merge") && it.name.contains("JniLibFolders") }.configureEach { packageTask ->
    packageTask.dependsOn 'copyAndroidNatives'
}
